name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build site
        run: |
          pnpm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-artifact
          path: ./dist
